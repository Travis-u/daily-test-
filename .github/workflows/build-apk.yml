name: Build Evan Companion APK

on:
  workflow_dispatch:
  push:
    branches: [ companion-ai-apk ]
    paths:
      - 'PureMusic/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build debug APK
        working-directory: PureMusic
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp PureMusic/app/build/outputs/apk/debug/app-debug.apk EvanCompanion-v0.1.1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EvanCompanion-v0.1.1-apk
          path: EvanCompanion-v0.1.1.apk
          if-no-files-found: error

      