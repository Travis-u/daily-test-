name: Build PureMusic APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'PureMusic/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build debug APK
        working-directory: PureMusic
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp PureMusic/app/build/outputs/apk/debug/app-debug.apk PureMusic.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PureMusic-apk
          path: PureMusic.apk
          if-no-files-found: error

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view puremusic-v0.2.1 >/dev/null 2>&1; then
            gh release upload puremusic-v0.2.1 PureMusic.apk --clobber
          else
            gh release create puremusic-v0.2.1 PureMusic.apk --title "PureMusic v0.2.1" --notes "PureMusic Android v0.1.0"
          fi
