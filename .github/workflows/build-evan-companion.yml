name: Build Evan Companion APK

on:
  workflow_dispatch:
  push:
    branches: [ companion-ai-apk ]
    paths:
      - 'PureMusic/**'
      - '.github/workflows/build-evan-companion.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build debug APK
        working-directory: PureMusic
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp PureMusic/app/build/outputs/apk/debug/app-debug.apk EvanCompanion.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Evan-Companion-apk
          path: EvanCompanion.apk
          if-no-files-found: error

      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view evan-companion-v0.1.0 >/dev/null 2>&1; then
            gh release upload evan-companion-v0.1.0 EvanCompanion.apk --clobber
          else
            gh release create evan-companion-v0.1.0 EvanCompanion.apk --title "Evan Companion v0.1.0" --notes "First test build of the local-first companion app."
          fi
