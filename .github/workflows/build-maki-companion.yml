name: Build Maki Audio Alarm Companion
on:
  push:
    branches: [maki-audio-alarm]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack Maki project
        run: unzip -q -o MakiAudioAlarm-standalone-v0.2-source.zip
      - name: Run Java alarm model tests
        run: bash MakiAudioAlarm-standalone/maki-audioalarm/tests/run_model_tests.sh
      - name: Build Android APK
        working-directory: MakiAudioAlarm-standalone
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MakiAudioAlarm-companion-debug-APK
          path: MakiAudioAlarm-standalone/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
