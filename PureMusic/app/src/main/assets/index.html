<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>纯音</title>
<style>
:root{--bg:#f7f7f3;--card:#ffffff;--text:#151515;--muted:#85857d;--line:#e7e7e0;--soft:#efefe9;--accent:#151515;--radius:24px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;min-height:100vh}
button,input{font:inherit}.app{max-width:620px;margin:auto;min-height:100vh;padding:18px 18px calc(102px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;padding:8px 2px 18px}.brand{font-size:22px;font-weight:720;letter-spacing:.08em}.status{font-size:12px;color:var(--muted);background:var(--soft);padding:6px 10px;border-radius:999px}
.page{display:none}.page.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 10px 30px rgba(20,20,20,.035)}
.cover{aspect-ratio:1/1;border-radius:32px;background:linear-gradient(145deg,#efefea,#d9d9d1);display:grid;place-items:center;margin:10px 0 22px;overflow:hidden;position:relative}.cover:before{content:"♫";font-size:min(22vw,120px);font-weight:700;opacity:.88}.cover.playing:after{content:"";position:absolute;inset:18%;border:1px solid rgba(0,0,0,.07);border-radius:50%}
.meta{text-align:center}.title{font-size:24px;font-weight:720;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artist{color:var(--muted);margin-top:7px}.progress{margin:26px 4px 8px}input[type=range]{width:100%;accent-color:#171717}.times{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}
.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;align-items:center;margin:24px auto 20px;max-width:310px}.ctrl{border:0;background:transparent;font-size:30px;height:58px}.play{width:64px;height:64px;border-radius:50%;background:#151515;color:#fff;font-size:25px;justify-self:center}.smallActions{display:flex;gap:10px;margin-top:18px}.pillBtn{flex:1;border:1px solid var(--line);background:var(--card);border-radius:18px;padding:13px 14px;color:var(--text)}
.searchBox{display:flex;gap:9px;margin-top:18px}.searchBox input{flex:1;border:1px solid var(--line);background:#fff;border-radius:16px;padding:14px 15px;outline:none}.searchBox button{border:0;background:#151515;color:white;border-radius:16px;padding:0 18px;font-weight:650}
.sectionTitle{font-size:13px;color:var(--muted);margin:24px 4px 10px}.chips{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px}.chat{height:calc(100vh - 280px);min-height:350px;overflow:auto;padding:8px 2px 18px;scrollbar-width:none}.msg{max-width:88%;padding:12px 14px;margin:10px 0;border-radius:18px;line-height:1.55;font-size:15px}.me{margin-left:auto;background:#151515;color:white;border-bottom-right-radius:6px}.ai{background:white;border:1px solid var(--line);border-bottom-left-radius:6px}.hint{font-size:12px;color:var(--muted);margin:6px 2px 0}.recs{display:grid;gap:8px;margin-top:10px}.rec{display:flex;justify-content:space-between;gap:8px;align-items:center;background:#f5f5f0;border-radius:14px;padding:10px 11px}.rec b{font-size:14px}.rec span{font-size:12px;color:var(--muted);display:block;margin-top:2px}.rec button{border:0;background:#151515;color:white;border-radius:999px;padding:7px 10px;font-size:12px;white-space:nowrap}.composer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(79px + env(safe-area-inset-bottom));width:min(calc(100% - 36px),584px);display:flex;gap:8px;background:rgba(247,247,243,.92);backdrop-filter:blur(18px);padding-top:8px}.composer input{flex:1;border:1px solid var(--line);background:white;border-radius:18px;padding:13px 14px;outline:none}.send{width:48px;border:0;background:#151515;color:#fff;border-radius:18px;font-size:20px}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(calc(100% - 36px),584px);height:62px;border-radius:22px;background:rgba(255,255,255,.91);backdrop-filter:blur(18px);border:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;padding:5px;box-shadow:0 12px 35px rgba(0,0,0,.08)}.nav button{border:0;background:transparent;border-radius:17px;color:var(--muted);font-weight:650}.nav button.active{background:#151515;color:white}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.22);display:none;align-items:flex-end;justify-content:center;z-index:10}.modal.show{display:flex}.sheet{width:min(100%,620px);background:#fff;border-radius:28px 28px 0 0;padding:20px 20px calc(26px + env(safe-area-inset-bottom))}.sheet h3{margin:0 0 10px}.sheet p{color:var(--muted);font-size:14px;line-height:1.55}.sheet input[type=file]{width:100%;border:1px dashed var(--line);border-radius:16px;padding:16px;margin:8px 0}.close{width:100%;border:0;border-radius:16px;background:#151515;color:#fff;padding:13px;margin-top:8px}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="brand">纯音</div><div class="status">无推荐流 · 无社区</div></div>
  <section id="player" class="page active">
    <div id="cover" class="cover"></div>
    <div class="meta"><div id="trackTitle" class="title">尚未播放</div><div id="trackArtist" class="artist">网易云负责曲库，纯音只负责听歌</div></div>
    <div class="progress"><input id="seek" type="range" min="0" max="100" value="0"><div class="times"><span id="now">0:00</span><span id="dur">0:00</span></div></div>
    <div class="controls"><button id="prev" class="ctrl">‹</button><button id="play" class="ctrl play">▶</button><button id="next" class="ctrl">›</button></div>
    <div class="searchBox"><input id="search" placeholder="歌名、歌手、歌单关键词"><button onclick="openNetEase(document.getElementById('search').value)">网易云找</button></div>
    <div class="smallActions"><button class="pillBtn" onclick="showLocal()">本地试听</button><button class="pillBtn" onclick="openNetEase('私人FM')">打开网易云</button></div>
    <div class="sectionTitle">快速场景</div><div class="chips"><button class="chip" onclick="goAI('学习 40 分钟，低干扰，有一点节奏，不要太困')">学习</button><button class="chip" onclick="goAI('骑车听，节奏感强一点，但不要俗套')">骑车</button><button class="chip" onclick="goAI('夜晚听，安静、克制，有一点孤独感')">夜晚</button><button class="chip" onclick="goAI('随机给我一个平时不太会主动点开的音乐方向')">随机发现</button></div>
  </section>
  <section id="ai" class="page">
    <div class="chips"><button class="chip" onclick="ask('学习 40 分钟，低干扰，有一点节奏')">学习</button><button class="chip" onclick="ask('骑车听，节奏感强')">骑车</button><button class="chip" onclick="ask('夜晚，安静但别太丧')">夜晚</button><button class="chip" onclick="ask('想听点新东西')">随机</button></div>
    <div id="chat" class="chat"><div class="msg ai">告诉我现在的场景、情绪，或者你最近喜欢的歌。我会把要求压成几个网易云可直接搜索的方向。<div class="hint">v0.1 使用本地推荐逻辑，不上传聊天内容。</div></div></div>
    <div class="composer"><input id="prompt" placeholder="比如：做数学，想清醒一点，别有人声"><button class="send" onclick="send()">↑</button></div>
  </section>
</div>
<nav class="nav"><button id="navPlayer" class="active" onclick="switchPage('player')">听歌</button><button id="navAI" onclick="switchPage('ai')">AI 找歌</button></nav>
<div id="localModal" class="modal" onclick="if(event.target===this)hideLocal()"><div class="sheet"><h3>本地试听</h3><p>可选功能。你不需要把音乐“导入”进 App，只需临时选一首本地音频试听；退出后不复制文件。</p><input id="file" type="file" accept="audio/*"><button class="close" onclick="hideLocal()">完成</button></div></div>
<audio id="audio"></audio>
<script>
const $=id=>document.getElementById(id); const audio=$('audio'); let currentName='';
function switchPage(p){['player','ai'].forEach(x=>$(x).classList.toggle('active',x===p));$('navPlayer').classList.toggle('active',p==='player');$('navAI').classList.toggle('active',p==='ai')}
function goAI(text){switchPage('ai');ask(text)}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openNetEase(q){q=(q||'').trim();if(!q)return;location.href='https://music.163.com/#/search/m/?s='+encodeURIComponent(q)}
function addMsg(kind,html){const d=document.createElement('div');d.className='msg '+kind;d.innerHTML=html;$('chat').appendChild(d);$('chat').scrollTop=$('chat').scrollHeight}
const banks={
 study:[['极简钢琴 / minimal piano','适合需要保持思路连续时'],['氛围电子 / ambient electronic','有流动感，但不会抢注意力'],['后摇纯音乐 / instrumental post-rock','需要一点推进感时'],['巴赫 平均律 / Bach WTC','结构清楚，适合长时间工作']],
 ride:[['synthwave 骑行','稳定拍点，适合骑行节奏'],['indie rock driving','比流行歌更有推进感'],['drum and bass melodic','速度感明显，避免太软'],['city pop upbeat','轻快但不至于太炸']],
 night:[['dream pop 夜晚','柔和、有空间感'],['ambient 夜色','安静、克制'],['indie folk late night','有人声但整体收敛'],['city pop midnight','夜行感更强']],
 calm:[['neo-classical calm','清醒但不刺激'],['piano ambient','低存在感'],['bossa nova soft','轻松、不沉闷'],['jazz trio mellow','有细节但不过分抢耳']],
 random:[['shoegaze essentials','声音层次很厚，和常规流行差异大'],['巴西 bossa nova','节奏轻，适合换口味'],['现代古典 / neo-classical','旋律与质感都比较克制'],['日系器乐 math rock','节奏细密，适合想听新鲜东西时']]
};
function recommend(t){const s=t.toLowerCase();let key='random';if(/学习|数学|物理|作业|专注|study/.test(s))key='study';else if(/骑|跑|运动|ride/.test(s))key='ride';else if(/夜|睡前|孤独|night/.test(s))key='night';else if(/安静|舒缓|放松|calm/.test(s))key='calm';let arr=[...banks[key]];
 let extra=[]; if(/不要人声|纯音乐|无人声/.test(s))extra.push('纯音乐'); if(/日语|日本/.test(s))extra.push('日系'); if(/俄语|俄罗斯/.test(s))extra.push('俄语'); if(/英文|英语/.test(s))extra.push('英文'); if(/不困|清醒/.test(s))extra.push('清醒'); if(/别太吵|不要太吵|克制/.test(s))extra.push('低刺激');
 return arr.slice(0,3).map(([q,r])=>[([q,...extra].join(' ')).trim(),r]);}
function ask(text){text=(text||'').trim();if(!text)return;addMsg('me',esc(text));const recs=recommend(text);let h='我先给你三个方向。它们不是“猜你爱听”的推荐流，而是按你刚刚的条件筛：<div class="recs">';recs.forEach(([q,r])=>h+=`<div class="rec"><div><b>${esc(q)}</b><span>${esc(r)}</span></div><button onclick="openNetEase('${q.replace(/'/g,"\\'")}')">去搜</button></div>`);h+='</div><div class="hint">你也可以继续说“第二个太吵”“想更冷一点”“只要女声”之类，我会继续收窄。</div>';setTimeout(()=>addMsg('ai',h),180)}
function send(){const i=$('prompt');const t=i.value;i.value='';ask(t)}$('prompt').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
function showLocal(){$('localModal').classList.add('show')}function hideLocal(){$('localModal').classList.remove('show')}
$('file').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;audio.src=URL.createObjectURL(f);currentName=f.name.replace(/\.[^.]+$/,'');$('trackTitle').textContent=currentName;$('trackArtist').textContent='本地试听';hideLocal();audio.play();$('play').textContent='Ⅱ';$('cover').classList.add('playing')});
$('play').onclick=()=>{if(!audio.src){goAI('我现在就想听歌，给我三个快速方向');return}if(audio.paused){audio.play();$('play').textContent='Ⅱ';$('cover').classList.add('playing')}else{audio.pause();$('play').textContent='▶';$('cover').classList.remove('playing')}};
$('prev').onclick=()=>{if(audio.src)audio.currentTime=Math.max(0,audio.currentTime-15)};$('next').onclick=()=>{if(audio.src)audio.currentTime=Math.min(audio.duration||0,audio.currentTime+15)};
audio.addEventListener('timeupdate',()=>{if(!audio.duration)return;$('seek').value=(audio.currentTime/audio.duration)*100;$('now').textContent=fmt(audio.currentTime);$('dur').textContent=fmt(audio.duration)});$('seek').oninput=e=>{if(audio.duration)audio.currentTime=(+e.target.value/100)*audio.duration};audio.addEventListener('ended',()=>{$('play').textContent='▶';$('cover').classList.remove('playing')});
function fmt(n){if(!isFinite(n))return'0:00';const m=Math.floor(n/60),s=Math.floor(n%60);return m+':'+String(s).padStart(2,'0')}
</script>
</body>
</html>
